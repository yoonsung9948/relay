[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "relay"
version = "0.1.0"
description = "Custom LLM inference engine"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "typer",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "types-requests",
]


[project.scripts]
relay = "engine.cli.cli:app"


[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]


[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true