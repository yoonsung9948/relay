model:
  repo: Qwen/Qwen3-8B
  family: qwen3
  parameter_count_b: 8.2

# Qwen/Qwen3-8B config.json; the generic architecture defaults are for 0.6B.
architecture:
  vocab_size: 151936
  hidden_size: 4096
  intermediate_size: 12288
  num_hidden_layers: 36
  num_attention_heads: 32
  num_key_value_heads: 8
  head_dim: 128
  rms_norm_eps: 1.0e-6
  rope_parameters:
    rope_type: default
    rope_theta: 1000000.0
  max_position_embeddings: 40960
  attention_bias: false
  tie_word_embeddings: false

serve:
  host: 127.0.0.1
  port: 8000
  
scheduler:
  policy: round_robin
  batch_size: 1