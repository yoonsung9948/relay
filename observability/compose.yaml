name: relay-observability
services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    user: "${OTEL_COLLECTOR_UID:-1000}:${OTEL_COLLECTOR_GID:-1000}"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
      - ./traces:/traces
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    environment:
      ENGINE_METRICS_TARGET: ${ENGINE_METRICS_TARGET:-host.docker.internal:8000}
      CONTROL_PLANE_METRICS_TARGET: ${CONTROL_PLANE_METRICS_TARGET:-host.docker.internal:8080}
      RELAY_DEMO_KEY: ${RELAY_DEMO_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [jaeger]
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [collector]
volumes:
  prometheus-data:

