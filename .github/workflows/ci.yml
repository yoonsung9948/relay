name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./...
      - name: Test with race detection
        run: go test -race -timeout 5m ./...

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Fail instead of downloading checkpoints; these tests use fakes/tiny models.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/requirements.txt
            docker/requirements.txt
      - name: Install CPU dependencies
        run: |
          # Install Torch from its CPU index before resolving the shared runtime pins.
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ci/requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python -c 'import torch; assert torch.version.cuda is None, "Expected CPU-only Torch"'
      - name: Lint
        run: python -m ruff check engine tests tools/build_image.py
      - name: Test without model downloads
        run: python -m pytest tests engine/tests/unit -q
